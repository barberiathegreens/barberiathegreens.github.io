<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Greens · Citas</title>
<meta name="theme-color" content="#1D5A3C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Greens">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-apple.png">
<style>
  html, body { margin: 0; height: 100%; background: #1D5A3C; }
  body { padding-top: env(safe-area-inset-top, 0px); box-sizing: border-box; }
  iframe { display: block; width: 100%; height: 100%; border: 0; background: #EEF2EE; }
  .msg { font: 16px/1.5 system-ui, sans-serif; color: #fff; padding: 32px 20px; max-width: 480px; margin: 0 auto; }
  .msg a { color: #F5EDDA; }
</style>
<script src="config.js"></script>
</head>
<body>
<script>
  (function () {
    var url = window.APP_URL || '';
    if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)) {
      document.body.innerHTML = '<div class="msg"><b>Falta el link de la app.</b><br>Abre config.js y pega el link que termina en /exec.</div>';
      return;
    }
    var f = document.createElement('iframe');
    f.src = url + '';
    f.title = 'The Greens · Citas';
    f.allow = 'clipboard-write';
    document.body.appendChild(f);
  })();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
<noscript><div class="msg">Activa JavaScript para usar la app.</div></noscript>
</body>
</html>
